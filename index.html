<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Düzen: tek sütunlu telefon uygulaması. Üstte başlık, ortada sekme içeriği, altta sabit gezinme çubuğu. */
:root{
  --bg:#F3F7EE; --surface:#FFFFFF; --ink:#102619; --muted:#5A6B5F; --line:#DAE4D4;
  --pitch:#0E9F4F; --pitch-ink:#FFFFFF; --pitch-soft:#DDF3E5;
  --a:#F25C1E; --a-soft:#FFE7DC; --b:#1F63E8; --b-soft:#DFE9FF;
  --gold:#E9A800; --danger:#C9303B; --danger-soft:#FBE3E5;
  --field:#2F9E58; --field2:#2A9150; --fline:rgba(255,255,255,.88); --ta:#E5500F; --tb:#1D55D1;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1711; --surface:#15231A; --ink:#EAF3EA; --muted:#9BB0A1; --line:#26392C;
    --pitch:#2FD27A; --pitch-ink:#07140C; --pitch-soft:#12301F;
    --a:#FF7A45; --a-soft:#3A2218; --b:#6C9BFF; --b-soft:#17264A;
    --gold:#FFCB2E; --danger:#FF6B73; --danger-soft:#3A1A1D; color-scheme:dark;
    --field:#1F6B3E; --field2:#1B5F37;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1711; --surface:#15231A; --ink:#EAF3EA; --muted:#9BB0A1; --line:#26392C;
  --pitch:#2FD27A; --pitch-ink:#07140C; --pitch-soft:#12301F;
  --a:#FF7A45; --a-soft:#3A2218; --b:#6C9BFF; --b-soft:#17264A;
  --gold:#FFCB2E; --danger:#FF6B73; --danger-soft:#3A1A1D; color-scheme:dark;
  --field:#1F6B3E; --field2:#1B5F37;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-block:14px 100px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pitch); outline-offset:2px}
h1,h2,h3{font-family:var(--font-display); font-weight:800; letter-spacing:.01em; margin:0; text-wrap:balance}
h2{font-size:24px; text-transform:uppercase; letter-spacing:.04em}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px; min-width:0}

/* takımlar */
.teams{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* saha */
.pitch{position:relative; width:100%; max-width:430px; margin:0 auto; aspect-ratio:100/215; border-radius:14px; overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--field) 0 10%,var(--field2) 10% 20%)}

.pl-lines{fill:none; stroke:var(--fline); stroke-width:.7}

.half{position:absolute; left:0; right:0; height:50%; display:flex; justify-content:space-evenly; z-index:1}
.half.A{top:0; flex-direction:column; padding:36px 4px 26px}
.half.B{bottom:0; flex-direction:column-reverse; padding:26px 4px 36px}
.frow{display:flex; justify-content:space-around; align-items:flex-start; gap:6px}
.tok{display:flex; flex-direction:column; align-items:center; gap:3px; border:0; background:transparent; padding:2px; min-width:0; flex:0 1 84px}
.disc{width:42px; max-width:100%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:19px; color:#fff; border:2.5px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,.3)}
.tok.A .disc{background:var(--ta)}
.tok.B .disc{background:var(--tb)}
.tn{max-width:100%; white-space:normal; overflow-wrap:anywhere; text-align:center; line-height:1.15; font-size:11.5px; font-weight:700; color:#fff; background:rgba(0,0,0,.55); padding:2px 6px; border-radius:8px}
.tok.sel .disc{outline:3px solid var(--gold); outline-offset:2px; transform:scale(1.12)}
.tok.empty .disc{background:rgba(255,255,255,.14); border:2px dashed rgba(255,255,255,.9); box-shadow:none; font-size:24px; font-weight:600}
.plabel{position:absolute; left:10px; z-index:2; font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; color:#fff; font-variant-numeric:tabular-nums}
.plabel.A{top:8px; background:var(--ta)}
.plabel.B{bottom:8px; background:var(--tb)}
.bench{display:flex; flex-direction:column; gap:8px}
#app{display:flex; flex-direction:column; gap:14px}
.seg button[disabled]{opacity:.4; cursor:not-allowed}

/* skor */
.board{display:flex; align-items:center; justify-content:center; gap:14px; font-family:var(--font-display); font-weight:800; font-size:64px; line-height:1}
.board .a{color:var(--a)} .board .b{color:var(--b)} .board i{font-style:normal; color:var(--muted); font-size:40px}
.srow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 0; border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .nm{flex:1 1 110px; min-width:0; font-weight:600; overflow-wrap:anywhere}
.steps{display:flex; gap:8px; flex-wrap:wrap}
.mvp{border:1.5px solid var(--line); background:transparent; border-radius:999px; width:36px; height:36px; color:var(--muted); font-size:16px; line-height:1}
.mvp[aria-pressed="true"]{background:var(--gold); border-color:var(--gold); color:#1d1500}
.sub{font-size:12px; color:var(--muted); font-weight:600}

/* geçmiş */
.match{display:flex; flex-direction:column; gap:10px}
.mscore{font-family:var(--font-display); font-weight:800; font-size:40px; line-height:1; display:flex; gap:10px; align-items:baseline}
.mscore .a{color:var(--a)} .mscore .b{color:var(--b)} .mscore i{font-style:normal;color:var(--muted);font-size:28px}
.tag{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; background:var(--a-soft); color:var(--a); padding:2px 8px; border-radius:999px}
.lines{display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:13px}
@media (max-width:420px){.lines{grid-template-columns:1fr}}
.lines b.a{color:var(--a)} .lines b.b{color:var(--b)}
.lines div{min-width:0; overflow-wrap:anywhere}

/* istatistik */
.leaders{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.leader{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:2px; min-width:0}
.leader b{font-family:var(--font-display); font-size:30px; line-height:1}
.leader span{overflow-wrap:anywhere; font-weight:600; font-size:13px}
.tablebox{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; min-width:460px}
th,td{padding:8px 6px; text-align:center; border-top:1px solid var(--line); font-size:14px}
th{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border-top:0}
td.who,th.who{text-align:left}
td.who{font-weight:600}
td.hl,th.hl{background:var(--pitch-soft); font-weight:700}

/* gezinme */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; gap:4px;
  background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
}
.nav button{flex:1; border:0; background:transparent; min-height:48px; border-radius:10px; font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); position:relative}
.nav button[aria-current="page"]{color:var(--pitch); background:var(--pitch-soft)}
@media (prefers-reduced-motion: no-preference){ .btn,.chip,.pl{transition:transform .08s ease, background-color .15s ease} }
</style>

<script>
(function(){
'use strict';
var BIN_URL='https://api.npoint.io/2f0a4a1356fa7b1d3d88';
var POS={K:'Kaleci',D:'Defans',O:'Orta saha',F:'Forvet'};
var TEAM={A:'Turuncu',B:'Mavi'};

function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clamp(x,a,b){return Math.min(b,Math.max(a,x));}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});}
var ORD=['Birinci','İkinci','Üçüncü','Dördüncü','Beşinci','Altıncı','Yedinci','Sekizinci','Dokuzuncu','Onuncu',
  'On birinci','On ikinci','On üçüncü','On dördüncü','On beşinci','On altıncı','On yedinci','On sekizinci','On dokuzuncu','Yirminci'];
function weekName(n){return n<=ORD.length?ORD[n-1]+' hafta':n+'. hafta';}
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){var p=s.split('-').map(Number);return isoOf(new Date(p[0],p[1]-1,p[2]+n));}
function isTuesday(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getDay()===2;}
function nextTuesday(s){var x=s;while(!isTuesday(x))x=addDays(x,1);return x;}
function fmtDay(s,y){
  var p=s.split('-').map(Number),o={weekday:'long',day:'numeric',month:'long'};
  if(y)o.year='numeric';
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('tr-TR',o);
}
function weekDate(n){return addDays(S.week1,7*(n-1));}
function weekLabel(n){return weekName(n)+' · '+fmtDay(weekDate(n));}
function defaultWeek(){var n=1;while(S.matches.some(function(m){return m.week===n;}))n++;return n;}
function mkey(m){return m.week?weekDate(m.week):m.date;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- veri ---------- */
function seed(){
  return {players:[],matches:[],week1:nextTuesday(today()),lineups:{}};
}

function persist(){
  fetch(BIN_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(S)
  }).catch(function(e){ console.error('Kaydetme hatası', e); });
}

var S = seed();

fetch(BIN_URL)
  .then(function(res){ return res.json(); })
  .then(function(d){
    if(d && Array.isArray(d.players) && Array.isArray(d.matches)){
      S.players = d.players;
      S.matches = d.matches;
      S.week1 = d.week1 || nextTuesday(today());
      S.lineups = d.lineups || {};
      render();
    }
  }).catch(function(e){ console.error('Yükleme hatası', e); });

var ui={tab:'mac',step:'kadro',view2:'saha',pick:null,week:defaultWeek(),wmsg:'',mode:'dengeli',fmt:7,sort:'puan',confirm:null,msg:'',
  draft:{sel:[],slots:null,form:null,goals:{},assists:{},ogA:0,ogB:0,mvp:null}};

/* ---------- hesaplar ---------- */
function ratingOf(p,x){
  if(!x.n)return p.power;
  var winRate=(x.w+0.5*x.d)/x.n, ga=(x.g+x.a)/x.n, mvpRate=x.mvp/x.n;
  var perf=1+9*clamp(0.5*winRate+0.3*clamp(ga/2,0,1)+0.2*clamp(mvpRate/0.4,0,1),0,1);
  var k=Math.min(x.n,10);
  return (p.power*4+perf*k)/(4+k);
}
function computeStats(){
  var st={};
  S.players.forEach(function(p){st[p.id]={n:0,w:0,d:0,l:0,g:0,a:0,mvp:0,rating:0};});
  S.matches.forEach(function(m){
    [['a',m.scoreA,m.scoreB],['b',m.scoreB,m.scoreA]].forEach(function(s){
      m[s[0]].forEach(function(id){
        var x=st[id];if(!x)return;
        x.n++;
        if(s[1]>s[2])x.w++;else if(s[1]<s[2])x.l++;else x.d++;
        x.g+=m.goals[id]||0;x.a+=m.assists[id]||0;
        if(m.mvp===id)x.mvp++;
      });
    });
  });
  S.players.forEach(function(p){st[p.id].rating=ratingOf(p,st[p.id]);});
  return st;
}
function player(id){return S.players.filter(function(p){return p.id===id;})[0];}
function nameOf(id,m){var p=player(id);return p?p.name:((m&&m.names&&m.names[id])||'Silinmiş oyuncu');}

function balance(ids){
  var st=computeStats();
  var P=ids.map(function(id){var p=player(id);return {id:id,pos:p.pos,r:st[id].rating};});
  var n=P.length,sizeA=Math.ceil(n/2),sizeB=n-sizeA;
  var tot=P.reduce(function(s,x){return s+x.r;},0);
  var cT={K:0,D:0,O:0,F:0};P.forEach(function(x){cT[x.pos]++;});
  var cand=[];
  for(var it=0;it<3000;it++){
    var sh=shuffle(P),sum=0,cA={K:0,D:0,O:0,F:0};
    for(var i=0;i<sizeA;i++){sum+=sh[i].r;cA[sh[i].pos]++;}
    var avgDiff=Math.abs(sum/sizeA-(sizeB?(tot-sum)/sizeB:0));
    var cost=avgDiff*(n/2)*3;
    'KDOF'.split('').forEach(function(k){cost+=Math.abs(cA[k]-(cT[k]-cA[k]))*(k==='K'?4:1.5);});
    cand.push({cost:cost,ids:sh.slice(0,sizeA).map(function(x){return x.id;})});
  }
  cand.sort(function(a,b){return a.cost-b.cost;});
  var best=cand[0].cost,pool=cand.filter(function(c){return c.cost<=best+0.6;}).slice(0,8);
  var pick=pool[Math.floor(Math.random()*pool.length)];
  var swap=Math.random()<0.5;
  var teamA=pick.ids,teamB=ids.filter(function(id){return pick.ids.indexOf(id)<0;});
  return swap?{A:teamB,B:teamA}:{A:teamA,B:teamB};
}
function randomSplit(ids){
  var sh=shuffle(ids),sizeA=Math.ceil(ids.length/2),swap=Math.random()<0.5;
  var a=sh.slice(0,sizeA),b=sh.slice(sizeA);
  return swap?{A:b,B:a}:{A:a,B:b};
}
function draftTeams(){
  var d=ui.draft,sl=d.slots||{A:[],B:[]};
  var A=sl.A.filter(function(x){return x!==null;}),B=sl.B.filter(function(x){return x!==null;});
  return {A:A,B:B,P:d.sel.filter(function(id){return A.indexOf(id)<0&&B.indexOf(id)<0;})};
}
function draftScore(){
  var d=ui.draft,t=draftTeams();
  function sum(ids){return ids.reduce(function(s,i){return s+(d.goals[i]||0);},0);}
  return {a:sum(t.A)+d.ogB,b:sum(t.B)+d.ogA};
}
function resetDraft(){ui.pick=null;ui.step='kadro';ui.view2='saha';ui.draft={sel:[],slots:null,form:null,goals:{},assists:{},ogA:0,ogB:0,mvp:null};}

/* saha dizilişi */
var FORMS={1:['1'],2:['1-1','2'],3:['1-1-1','2-1','1-2'],4:['2-2','1-2-1','2-1-1','1-1-2'],
  5:['2-2-1','2-1-2','1-3-1','3-2'],6:['3-2-1','2-3-1','2-2-2','1-3-2','3-1-2'],
  7:['3-3-1','3-2-2','2-3-2','4-2-1','2-4-1'],8:['3-3-2','4-3-1','3-4-1','4-2-2']};
function defaultForm(size){
  var o=size-1;
  if(o<=0)return '';
  if(FORMS[o])return FORMS[o][0];
  var f=o>=9?3:2,r=o-f,dd=Math.floor(r/2);
  return dd+'-'+(r-dd)+'-'+f;
}
function formsFor(size){var o=size-1;return FORMS[o]||[defaultForm(size)];}
function validForm(f,size){return typeof f==='string'&&formsFor(size).indexOf(f)>=0;}
function formOf(side,size){var f=ui.draft.form&&ui.draft.form[side];return validForm(f,size)?f:defaultForm(size);}
function linesOf(f){return f?f.split('-').map(Number).filter(function(x){return x>0;}):[];}
function rowsOf(f){return [1].concat(linesOf(f));}
function rowTypes(f){
  var n=linesOf(f).length,t={0:[],1:['O'],2:['D','F'],3:['D','O','F'],4:['D','O','O','F']}[n]||['D','O','F'];
  return ['K'].concat(t);
}
function assignSlots(ids,size,form){
  var rows=rowsOf(form),types=rowTypes(form),rem=ids.slice(),slots=[];
  rows.forEach(function(c,ri){
    for(var k=0;k<c;k++){
      var idx=-1;
      for(var j=0;j<rem.length;j++){if(player(rem[j]).pos===types[ri]){idx=j;break;}}
      if(idx>=0){slots.push(rem[idx]);rem.splice(idx,1);}else slots.push(null);
    }
  });
  for(var s=0;s<slots.length&&rem.length;s++){if(slots[s]===null)slots[s]=rem.shift();}
  return slots;
}
function locate(id){
  var sl=ui.draft.slots;if(!sl)return null;
  var sides=['A','B'];
  for(var s=0;s<2;s++){var i=sl[sides[s]].indexOf(id);if(i>=0)return {side:sides[s],i:i};}
  return null;
}
function pickPlayer(id){
  var d=ui.draft;
  if(!d.slots){ui.pick=null;return;}
  if(ui.pick===id){ui.pick=null;return;}
  if(!ui.pick){ui.pick=id;return;}
  var s=ui.pick,ls=locate(s),lt=locate(id);
  if(!ls&&!lt){ui.pick=id;return;}
  if(lt)d.slots[lt.side][lt.i]=s;
  if(ls)d.slots[ls.side][ls.i]=id;
  ui.pick=null;
}
function pickSlot(side,i){
  var d=ui.draft,s=ui.pick;
  if(!s||!d.slots||d.slots[side][i]!==null){ui.pick=null;return;}
  var ls=locate(s);if(ls)d.slots[ls.side][ls.i]=null;
  d.slots[side][i]=s;ui.pick=null;
}

  var sum=ids.reduce(function(s,id){return s+st[id].rating;},0);
  var h='<div class="team '+side+'"><h3><span>'+(side==='P'?'Havuz':'Takım '+TEAM[side])+'</span><small>'+ids.length+' kişi'+(side!=='P'&&ids.length?' · ort. '+(sum/ids.length).toFixed(1):'')+'</small></h3>';
  if(!ids.length)h+='<small>'+(side==='P'?'Herkes bir takıma atandı.':'Henüz oyuncu yok.')+'</small>';
  ids.forEach(function(id){
    var p=player(id);
    h+='<button class="pl" data-act="cycle" data-id="'+id+'" aria-label="'+esc(p.name)+' takımını değiştir"><span class="pos">'+p.pos+'</span><span class="nm">'+esc(p.name)+'</span><em>'+st[id].rating.toFixed(1)+'</em></button>';
  });

function token(side,i,id){
  if(id===null)return '<button class="tok empty" data-act="slot" data-side="'+side+'" data-i="'+i+'" aria-label="Boş yer"><span class="disc">+</span></button>';
  var p=player(id),sel=ui.pick===id;
  return '<button class="tok '+side+(sel?' sel':'')+'" data-act="pick" data-id="'+id+'" aria-pressed="'+sel+'" aria-label="'+esc(p.name)+'"><span class="disc">'+p.pos+'</span><span class="tn">'+esc(p.name)+'</span></button>';
}
function pitchSection(t,st){
  var d=ui.draft,h='<section class="card"><h2>Saha</h2>';
  if(!d.slots){
    return h+'<p class="muted" style="margin:0">Takımları kurunca oyuncular sahada görünür. Sonra oyuncuları sahada yer değiştirebilirsin.</p></section>';
  }
  function avg(ids){return ids.length?(ids.reduce(function(s,i){return s+st[i].rating;},0)/ids.length).toFixed(1):'–';}
  function half(side){
    var sl=d.slots[side],rows=rowsOf(formOf(side,sl.length)),k=0,out='';
    rows.forEach(function(c){
      if(!c)return;
      out+='<div class="frow">';
      for(var j=0;j<c;j++,k++)out+=token(side,k,sl[k]);
      out+='</div>';
    });
    return '<div class="half '+side+'">'+out+'</div>';
  }
  var freeSlot=d.slots.A.indexOf(null)>=0||d.slots.B.indexOf(null)>=0;
  function formSel(side,label){
    var size=d.slots[side].length,cur=formOf(side,size);
    return '<div class="field"><label class="label" for="form'+side+'">'+label+' dizilişi</label><select id="form'+side+'" data-chg="form" data-side="'+side+'">'+
      formsFor(size).map(function(f){return '<option value="'+f+'"'+(f===cur?' selected':'')+'>'+(f||'Tek oyuncu')+'</option>';}).join('')+'</select></div>';
  }
  h+='<div class="row">'+formSel('A','Turuncu')+formSel('B','Mavi')+'</div>'+
    '<small>Dizilişi değiştirince oyuncular pozisyonlarına göre yeniden yerleşir. Önce bir oyuncuya, sonra yerini değiştireceğin oyuncuya ya da boş yere dokun. Seçimi iptal etmek için aynı oyuncuya tekrar dokun.</small>'+
    '<div class="pitch">'+
      '<svg viewBox="0 0 100 215" aria-hidden="true"><g class="pl-lines" fill="none">'+
      '<rect x="3" y="3" width="94" height="209" rx="1"/><line x1="3" y1="107.5" x2="97" y2="107.5"/><circle cx="50" cy="107.5" r="11"/>'+
      '<rect x="26" y="3" width="48" height="20"/><rect x="38" y="3" width="24" height="8"/>'+
      '<rect x="26" y="192" width="48" height="20"/><rect x="38" y="204" width="24" height="8"/>'+
      '<path d="M38 23 A12 12 0 0 0 62 23"/><path d="M38 192 A12 12 0 0 1 62 192"/></g>'+
      '<circle class="pl-dot" cx="50" cy="107.5" r="0.9" fill="#fff"/></svg>'+
      '<span class="plabel A">Turuncu · ort. '+avg(t.A)+'</span><span class="plabel B">Mavi · ort. '+avg(t.B)+'</span>'+
      half('A')+half('B')+
    '</div>'+
    '<div class="bench"><div class="label">Yedek / havuz</div>'+
    (t.P.length?'<div class="chips">'+t.P.map(function(id){
      var p=player(id),sel=ui.pick===id;
      return '<button class="chip" data-act="pick" data-id="'+id+'" aria-pressed="'+sel+'"><span class="pos">'+p.pos+'</span>'+esc(p.name)+'</button>';
    }).join('')+'</div>':'<small>Herkes sahada.</small>')+
    (t.P.length&&!freeSlot?'<small>Sahada boş yer yok. Yedekteki oyuncuyu sahadaki biriyle değiştir ya da kadrodan çıkar.</small>':'')+
    '</div>'+
    '<div class="row"><button class="btn alt" style="flex:1" data-act="savelu">Kadroyu kaydet</button><button class="btn" style="flex:1" data-act="view2" data-v="sonuc">Sonuç girişine geç</button></div></section>';
  return h;
}

function stepper(id,k,val){
  return '<div class="step"><button data-act="step" data-id="'+id+'" data-k="'+k+'" data-d="-1" aria-label="Azalt">−</button><b>'+val+'</b><button data-act="step" data-id="'+id+'" data-k="'+k+'" data-d="1" aria-label="Artır">+</button></div>';
}

function weekBar(showSave){
  var d=ui.draft,lu=S.lineups[ui.week],maxW=Math.max(20,ui.week),opts='',n;
  S.matches.forEach(function(m){if(m.week&&m.week+2>maxW)maxW=m.week+2;});
  for(n=1;n<=maxW;n++){
    var tags=[];
    if(S.matches.some(function(m){return m.week===this;},n))tags.push('maç kayıtlı');
    if(S.lineups[n])tags.push('kadro kayıtlı');
    opts+='<option value="'+n+'"'+(n===ui.week?' selected':'')+'>'+weekLabel(n)+(tags.length?' · '+tags.join(', '):'')+'</option>';
  }
  var sure=ui.confirm==='l:'+ui.week;
  var h='<section class="card"><h2>Hafta</h2>'+
    '<div class="field"><label class="label" for="weekSel">Hafta seç</label><select id="weekSel" data-chg="week">'+opts+'</select></div>';
  if(lu){
    h+='<div class="notice">Bu hafta için kayıtlı kadro var: '+lu.sel.length+' oyuncu, '+esc((lu.form&&lu.form.A)||'-')+' / '+esc((lu.form&&lu.form.B)||'-')+' dizilişi.</div>'+
      '<div class="row"><button class="btn small alt" data-act="loadlu">Kayıtlı kadroyu yükle</button>'+
      '<button class="ghost danger'+(sure?' sure':'')+'" data-act="dellu">'+(sure?'Emin misin?':'Kadroyu sil')+'</button></div>';
  }else{
    h+='<small>Bu hafta için kayıtlı kadro yok.</small>';
  }
  if(showSave&&d.slots)h+='<button class="btn wide" data-act="savelu">'+(lu?'Kayıtlı kadroyu güncelle':'Kadroyu bu hafta için kaydet')+'</button>';
  if(ui.wmsg)h+='<div class="notice">'+esc(ui.wmsg)+'</div>';
  h+='<details><summary class="label" style="cursor:pointer">Hafta takvimi</summary>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">'+
    '<div class="field"><label class="label" for="week1">Birinci hafta (Salı günü)</label><input type="date" id="week1" data-chg="week1" value="'+esc(S.week1)+'"></div>'+
    '<small>Haftalar her Salı günü olacak şekilde birer hafta arayla ilerler. Salı olmayan bir tarih seçersen sonraki Salı\'ya ayarlanır.</small></div></details></section>';
  return h;
}

  h+='</section>';

    var sure=ui.confirm==='m:'+m.id;

      return '<div><b class="'+cls+'">Takım '+TEAM[cls.toUpperCase()]+'</b><br>'+ids.map(function(id){

      '<div class="mscore"><span class="a">'+m.scoreA+'</span><i>–</i><span class="b">'+m.scoreB+'</span></div>'+
      '<div class="lines">'+line(m.a,'a')+line(m.b,'b')+'</div>'+

      '<button class="ghost danger'+(sure?' sure':'')+'" data-act="delm" data-id="'+m.id+'">'+(sure?'Emin misin?':'Maçı sil')+'</button></div></section>';
  });

function viewStats(st){
  var rows=S.players.map(function(p){return {p:p,x:st[p.id]};});
  var keys={puan:function(r){return r.x.rating;},gol:function(r){return r.x.g;},asist:function(r){return r.x.a;},mvp:function(r){return r.x.mvp;},galibiyet:function(r){return r.x.w;}};
  var f=keys[ui.sort];
  rows.sort(function(a,b){return (f(b)-f(a))||(b.x.rating-a.x.rating);});
  function leader(label,fn){
    var best=null;rows.forEach(function(r){if(fn(r)>0&&(!best||fn(r)>fn(best)))best=r;});
    return '<div class="leader"><span class="label">'+label+'</span>'+(best?'<b>'+fn(best)+'</b><span>'+esc(best.p.name)+'</span>':'<b>–</b><span class="muted">henüz yok</span>')+'</div>';
  }
  var h='<section class="card"><h2>Liderler</h2><div class="leaders">'+
    leader('Gol kralı',function(r){return r.x.g;})+leader('Asist',function(r){return r.x.a;})+leader('Maçın adamı',function(r){return r.x.mvp;})+'</div></section>';
  h+='<section class="card"><div class="row spread"><h2>Sıralama</h2><small>'+S.matches.length+' maç</small></div>'+
    '<div class="seg" role="group" aria-label="Sırala">'+[['puan','Puan'],['gol','Gol'],['asist','Asist'],['mvp','MVP'],['galibiyet','Galibiyet']].map(function(s){return '<button data-act="sort" data-s="'+s[0]+'" aria-pressed="'+(ui.sort===s[0])+'">'+s[1]+'</button>';}).join('')+'</div>';
  if(!rows.length)h+='<p class="muted" style="margin:0">Oyuncu eklenince tablo burada görünür.</p>';
  else{
    function th(label,k,cls){return '<th class="'+(cls||'')+(ui.sort===k?' hl':'')+'">'+label+'</th>';}
    function td(v,k){return '<td'+(ui.sort===k?' class="hl"':'')+'>'+v+'</td>';}
    h+='<div class="tablebox"><table><thead><tr><th>#</th><th class="who">Oyuncu</th><th>O</th>'+th('G','galibiyet')+'<th>B</th><th>M</th>'+th('Gol','gol')+th('Ast','asist')+th('MVP','mvp')+th('Puan','puan')+'</tr></thead><tbody>';
    rows.forEach(function(r,i){
      var x=r.x;
      h+='<tr><td>'+(i+1)+'</td><td class="who">'+esc(r.p.name)+'</td><td>'+x.n+'</td>'+td(x.w,'galibiyet')+'<td>'+x.d+'</td><td>'+x.l+'</td>'+td(x.g,'gol')+td(x.a,'asist')+td(x.mvp,'mvp')+td(x.rating.toFixed(1),'puan')+'</tr>';
    });
    h+='</tbody></table></div><small>O oynanan maç, G galibiyet, B beraberlik, M mağlubiyet, Ast asist.</small>';
  }
  return h+'</section>';
}

function render(){
  var st=computeStats(),html='';
  if(ui.tab==='oyuncular')html=viewPlayers(st);
  else if(ui.tab==='gecmis')html=viewHistory();
  else if(ui.tab==='istatistik')html=viewStats(st);
  else html=viewMac(st);
  $('#app').innerHTML=html;
  document.querySelectorAll('.nav button').forEach(function(b){b.setAttribute('aria-current',b.getAttribute('data-tab')===ui.tab?'page':'false');});
  $('#sub').textContent=S.players.length+' oyuncu · '+S.matches.length+' maç';
}

/* ---------- eylemler ---------- */
function removeFromDraft(id){
  var d=ui.draft;
  d.sel=d.sel.filter(function(x){return x!==id;});
  var lc=locate(id);if(lc)d.slots[lc.side][lc.i]=null;
  if(ui.pick===id)ui.pick=null;
  delete d.goals[id];delete d.assists[id];
  if(d.mvp===id)d.mvp=null;
}
function bump(obj,id,delta,max){obj[id]=clamp((obj[id]||0)+delta,0,max);}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),d=ui.draft;
  var keep=(act==='delp'||act==='delm'||act==='dellu');
  if(!keep)ui.confirm=null;
  if(act!=='pick'&&act!=='slot')ui.pick=null;
  if(act!=='save')ui.msg='';
  ui.wmsg='';
  if(act==='tab'){ui.tab=el.getAttribute('data-tab');window.scrollTo(0,0);}
  else if(act==='fmt'){ui.fmt=Number(el.getAttribute('data-n'));}
  else if(act==='mode'){ui.mode=el.getAttribute('data-m');}
  else if(act==='toggleSel'){
    if(d.sel.indexOf(id)>=0)removeFromDraft(id);else d.sel.push(id);
  }
  else if(act==='gen'){
    if(d.sel.length<2){ui.msg='En az 2 oyuncu seç.';}
    else{
      d.goals={};d.assists={};d.ogA=0;d.ogB=0;d.mvp=null;
      if(ui.mode!=='elle'){
        var r=ui.mode==='dengeli'?balance(d.sel):randomSplit(d.sel);
        d.form={A:formOf('A',r.A.length),B:formOf('B',r.B.length)};
        d.slots={A:assignSlots(r.A,r.A.length,d.form.A),B:assignSlots(r.B,r.B.length,d.form.B)};
      }else{
        var sizeA=Math.ceil(d.sel.length/2),sizeB=d.sel.length-sizeA;
        d.form={A:formOf('A',sizeA),B:formOf('B',sizeB)};
        d.slots={A:new Array(sizeA).fill(null),B:new Array(sizeB).fill(null)};
      }
      ui.step='saha';ui.view2='saha';window.scrollTo(0,0);
    }
  }
  else if(act==='savelu'){
    if(d.slots){
      S.lineups[ui.week]={sel:d.sel.slice(),slots:{A:d.slots.A.slice(),B:d.slots.B.slice()},form:{A:d.form.A,B:d.form.B},fmt:ui.fmt};
      persist();ui.wmsg=weekName(ui.week)+' kadrosu kaydedildi.';
    }
  }
  else if(act==='loadlu'){
    var lu=S.lineups[ui.week];
    if(lu){
      function alive(x){return x!==null&&player(x)?x:null;}
      d.sel=lu.sel.filter(function(x){return player(x);});
      d.slots={A:lu.slots.A.map(alive),B:lu.slots.B.map(alive)};
      d.form={A:lu.form.A,B:lu.form.B};
      d.goals={};d.assists={};d.ogA=0;d.ogB=0;d.mvp=null;
      if(lu.fmt)ui.fmt=lu.fmt;
      ui.step='saha';ui.view2='saha';window.scrollTo(0,0);
      ui.wmsg=weekName(ui.week)+' kadrosu yüklendi.';
    }
  }
  else if(act==='dellu'){
    if(ui.confirm==='l:'+ui.week){delete S.lineups[ui.week];ui.confirm=null;persist();}
    else ui.confirm='l:'+ui.week;
  }
  else if(act==='page'){ui.step=el.getAttribute('data-p');window.scrollTo(0,0);}
  else if(act==='view2'){ui.view2=el.getAttribute('data-v');window.scrollTo(0,0);}
  else if(act==='pick'){pickPlayer(id);}
  else if(act==='slot'){pickSlot(el.getAttribute('data-side'),Number(el.getAttribute('data-i')));}
  else if(act==='step'){bump(el.getAttribute('data-k')==='goals'?d.goals:d.assists,id,Number(el.getAttribute('data-d')),30);}
  else if(act==='og'){var s=el.getAttribute('data-s');d[s]=clamp(d[s]+Number(el.getAttribute('data-d')),0,30);}
  else if(act==='mvp'){d.mvp=d.mvp===id?null:id;}
  else if(act==='save'){
    var tt=draftTeams();
    if(!(tt.A.length&&tt.B.length&&!tt.P.length)){ui.msg='Önce herkesi bir takıma ata.';}
    else{
      var sc=draftScore(),goals={},assists={},names={};
      tt.A.concat(tt.B).forEach(function(i){
        if(d.goals[i])goals[i]=d.goals[i];if(d.assists[i])assists[i]=d.assists[i];names[i]=player(i).name;
      });
      S.matches.push({id:'m'+Date.now(),date:weekDate(ui.week),week:ui.week,a:tt.A,b:tt.B,goals:goals,assists:assists,ogA:d.ogA,ogB:d.ogB,scoreA:sc.a,scoreB:sc.b,mvp:d.mvp,names:names});
      persist();resetDraft();ui.week=defaultWeek();ui.tab='gecmis';ui.msg='Maç kaydedildi.';window.scrollTo(0,0);
    }
  }
  else if(act==='delm'){
    if(ui.confirm==='m:'+id){S.matches=S.matches.filter(function(m){return m.id!==id;});ui.confirm=null;persist();}
    else ui.confirm='m:'+id;
  }
  else if(act==='delp'){
    if(ui.confirm==='p:'+id){S.players=S.players.filter(function(p){return p.id!==id;});removeFromDraft(id);ui.confirm=null;persist();}
    else ui.confirm='p:'+id;
  }
  else if(act==='power'){
    var p=player(id);if(p){p.power=clamp(p.power+Number(el.getAttribute('data-d')),1,10);persist();}
  }
  else if(act==='sort'){ui.sort=el.getAttribute('data-s');}
  render();
});

document.addEventListener('change',function(e){
  var el=e.target.closest('[data-chg]');if(!el)return;
  if(el.getAttribute('data-chg')==='pos'){
    var p=player(el.getAttribute('data-id'));
    if(p){p.pos=el.value;persist();render();}
  }else if(el.getAttribute('data-chg')==='week'){
    ui.week=Number(el.value);ui.confirm=null;ui.wmsg='';render();
  }else if(el.getAttribute('data-chg')==='week1'){
    var v=el.value;
    if(v){
      ui.wmsg='';
      if(!isTuesday(v)){v=nextTuesday(v);ui.wmsg='Birinci hafta Salı günü olmalı. '+fmtDay(v,true)+' tarihine ayarlandı.';}
      S.week1=v;persist();render();
    }
  }else if(el.getAttribute('data-chg')==='form'){
    var side=el.getAttribute('data-side'),d=ui.draft;
    if(d.slots){
      var pl=d.slots[side].filter(function(x){return x!==null;});
      d.form[side]=el.value;
      d.slots[side]=assignSlots(pl,d.slots[side].length,el.value);
      ui.pick=null;render();
    }
  }
});

document.addEventListener('submit',function(e){
  if(e.target.id!=='addform')return;
  e.preventDefault();
  var name=$('#pname').value.trim();
  if(!name){ui.msg='Önce bir isim yaz.';render();return;}
  var pos=$('#ppos').value,power=Number($('#ppower').value);
  S.players.push({id:'p'+Date.now()+Math.floor(Math.random()*1000),name:name,pos:pos,power:power});
  persist();ui.msg=name+' kadroya eklendi.';render();
  var inp=$('#pname');if(inp)inp.focus();
});

render();
})();
</script>

</body></html>
